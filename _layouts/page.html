---
layout: default
---
<section class="page">
  <div class="container">
    <header class="page-head">
      <p class="breadcrumb"><a href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a></p>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.intro %}<p class="section-intro">{{ page.intro }}</p>{% endif %}
    </header>
    {{ content }}
  </div>
</section>
