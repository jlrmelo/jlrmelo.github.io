{%- assign p = site.data.profile -%}
{%- assign s = site.data.seo -%}
{%- assign home = site.url | append: site.baseurl | append: '/' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "@id": {{ home | append: '#profile' | jsonify }},
  "url": {{ home | jsonify }},
  "name": {{ p.name | append: ' — ' | append: p.role | jsonify }},
  "description": {{ s.summary | jsonify }},
  "inLanguage": "en",
  "mainEntity": {
    "@type": "Person",
    "@id": {{ home | append: '#person' | jsonify }},
    "name": {{ p.name | jsonify }},
    "alternateName": {{ s.alternate_name | jsonify }},
    "jobTitle": {{ p.role | jsonify }},
    "description": {{ s.summary | jsonify }},
    "url": {{ home | jsonify }},
    "image": {{ p.photo | default: page.image | absolute_url | jsonify }},
    "worksFor": { "@type": "Organization", "name": {{ s.employer.name | jsonify }}, "url": {{ s.employer.url | jsonify }} },
    "alumniOf": [{% for a in s.alumni %}
      { "@type": "CollegeOrUniversity", "name": {{ a.name | jsonify }}, "url": {{ a.url | jsonify }} }{% unless forloop.last %},{% endunless %}{% endfor %}
    ],
    "address": { "@type": "PostalAddress", "addressLocality": {{ s.location.locality | jsonify }}, "addressCountry": {{ s.location.country | jsonify }} },
    "identifier": { "@type": "PropertyValue", "propertyID": "ORCID", "value": {{ s.orcid | jsonify }} },
    "knowsAbout": {{ s.knows_about | jsonify }},
    "makesOffer": [{% for o in s.services %}
      { "@type": "Offer", "itemOffered": { "@type": "Service", "name": {{ o | jsonify }} } }{% unless forloop.last %},{% endunless %}{% endfor %}
    ],
    "sameAs": [{% for l in p.links %}{{ l.url | jsonify }}{% unless forloop.last %}, {% endunless %}{% endfor %}]
  }
}
</script>
