{%- assign home = site.url | append: site.baseurl | append: '/' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "url": {{ page.url | absolute_url | jsonify }},
  "name": {{ page.title | append: ' — ' | append: site.data.profile.name | jsonify }},
  "about": { "@id": {{ home | append: '#person' | jsonify }} },
  "hasPart": [{% for a in site.data.scholarly %}
    {
      "@type": "ScholarlyArticle",
      "headline": {{ a.title | jsonify }},
      "name": {{ a.title | jsonify }},
      "datePublished": {{ a.year | jsonify }},
      "isPartOf": { "@type": "CreativeWork", "name": {{ a.venue | jsonify }} },
      "author": [{% for n in a.authors %}{% if n contains 'Melo' and n contains 'Jos' %}{ "@id": {{ home | append: '#person' | jsonify }}, "@type": "Person", "name": {{ n | jsonify }} }{% else %}{ "@type": "Person", "name": {{ n | jsonify }} }{% endif %}{% unless forloop.last %}, {% endunless %}{% endfor %}]{% if a.doi %},
      "identifier": { "@type": "PropertyValue", "propertyID": "DOI", "value": {{ a.doi | jsonify }} },
      "sameAs": {{ 'https://doi.org/' | append: a.doi | jsonify }}{% endif %}
    }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]
}
</script>
